{% extends 'base.html' %}

{% block title %}Delete price{% endblock %}

{% block content %}
    <div class="p-4 mb-4 bg-light rounded-3 form-card">
        <h1 class="h2 fw-bold mb-3">Delete price</h1>
        <p class="text-danger">Are you sure you want to delete this price? This action cannot be undone.</p>

        <form method="post">
            {% csrf_token %}
            {% include 'partials/_form_fields.html' %}

            <button type="submit" class="btn btn-danger">Yes, delete</button>
            <a href="{% url 'pricing:price-list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
{% endblock %}
