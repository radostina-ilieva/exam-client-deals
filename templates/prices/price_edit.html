{% extends 'base.html' %}

{% block title %}Edit price{% endblock %}

{% block content %}
    <div class="p-4 mb-4 bg-light rounded-3 form-card">
        <h1 class="h2 fw-bold mb-2">Edit price</h1>
        <p class="text-muted mb-4">The year and the target group are locked. Only the base price can change.</p>

        <form method="post" novalidate>
            {% csrf_token %}
            {% include 'partials/_form_fields.html' %}

            <button type="submit" class="btn btn-primary">Save changes</button>
            <a href="{% url 'pricing:price-list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
{% endblock %}
