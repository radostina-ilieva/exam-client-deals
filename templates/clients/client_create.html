{% extends 'base.html' %}

{% block title %}Create client{% endblock %}

{% block content %}
    <div class="p-4 mb-4 bg-light rounded-3 form-card">
        <h1 class="h2 fw-bold mb-4">Create new client</h1>

        <form method="post" novalidate>
            {% csrf_token %}
            {% include 'partials/_form_fields.html' %}

            <button type="submit" class="btn btn-primary">Create</button>
            <a href="{% url 'clients:client-list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
{% endblock %}
